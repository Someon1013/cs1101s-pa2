ues(xs, expected):\n    current = xs\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Linked result ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected linked value\")\n        current = tail(current)\n    return pa_check(is_none(current), \"Unexpected extra linked values\")\n\ndef pa_snapshot(xs):\n    saved = [None] * length(xs)\n    for i in range(len(saved)):\n        saved[i] = [xs, head(xs), tail(xs)]\n        xs = tail(xs)\n    return saved\n\ndef pa_unchanged(saved):\n    for i in range(len(saved)):\n        node = saved[i][0]\n        pa_check(head(node) == saved[i][1], \"An input head changed\")\n        pa_check(tail(node) is saved[i][2], \"An input tail changed\")\n    return True\n\ndef pa_prefix(s, expected):\n    current = s\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Stream ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected stream value\")\n        if i + 1 < len(expected):\n            current = stream_tail(current)\n    return True\n", "id": "D34"}, {"n": 35, "title": "Evaluate lexical let expressions", "fn": "eval_let", "stage": "6 | Transfer and synthesis", "task": "Evaluate tagged indexed-list syntax: [\"num\",n], [\"var\",name], [\"add\",e1,e2], [\"mul\",e1,e2], [\"let\",name,rhs,body]. env is a linked list of pair(name,value) bindings, newest first, initially None, passed explicitly. A let evaluates rhs in the OLD environment, then body in an extended environment. All variables are bound. Do not use eval or mutate syntax/environment. Nested bindings must shadow outer ones only within their body.", "examples": "eval_let([\"let\", \"x\", [\"num\", 2],\n    [\"let\", \"x\", [\"add\", [\"var\", \"x\"], [\"num\", 3]],\n     [\"var\", \"x\"]]], None)\n# -> 5", "hints": ["Separate syntax selection, variable lookup, and environment extension.", "A binding record is pair(name,value); a new environment is pair(binding,old_env)."], "idea": "Lookup scans newest bindings first. The right-hand side must be evaluated before prepending the new binding; otherwise shadowing can change its meaning. This is a small evaluator, not a full implementation of the course evaluator.", "complexity": "O(E*D) worst case for E syntax nodes and maximum environment depth D; O(E+D) upper bound on allocated bindings and stack.", "section": "G23", "solution": "def eval_let(expr, env):\n    tag = expr[0]\n    if tag == 'num':\n        return expr[1]\n    if tag == 'var':\n        rest = env\n        while not is_none(rest):\n            binding = head(rest)\n            if head(binding) == expr[1]:\n                return tail(binding)\n            rest = tail(rest)\n        return error('Unbound variable')\n    if tag == 'add':\n        return eval_let(expr[1], env) + eval_let(expr[2], env)\n    if tag == 'mul':\n        return eval_let(expr[1], env) * eval_let(expr[2], env)\n    value = eval_let(expr[2], env)\n    extended = pair(pair(expr[1], value), env)\n    return eval_let(expr[3], extended)\n", "support": "", "starter": "def eval_let(expr, env):\n    # Replace this line with your solution.\n    return error(\"Not implemented yet\")\n", "tests": "expr = ['let','x',['num',2],\n    ['add', ['let','x',['add',['var','x'],['num',3]],['var','x']],\n            ['var','x']]]\npa_check(eval_let(expr, None) == 7, \"RHS sees outer x, body shadows locally\")\nenv = llist(pair('x',4), pair('x',9))\npa_check(eval_let(['mul',['var','x'],['num',3]], env) == 12, \"Nearest binding\")\npa_check(head(head(env)) == 'x' and tail(head(env)) == 4, \"Environment preserved\")\nprint(\"D35: all supplied checks passed\")\n", "testSupport": "# Practice helpers, defined here; these are not extra built-ins.\ndef pa_check(condition, message):\n    if not condition:\n        return error(message)\n    return True\n\ndef pa_values(xs, expected):\n    current = xs\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Linked result ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected linked value\")\n        current = tail(current)\n    return pa_check(is_none(current), \"Unexpected extra linked values\")\n\ndef pa_snapshot(xs):\n    saved = [None] * length(xs)\n    for i in range(len(saved)):\n        saved[i] = [xs, head(xs), tail(xs)]\n        xs = tail(xs)\n    return saved\n\ndef pa_unchanged(saved):\n    for i in range(len(saved)):\n        node = saved[i][0]\n        pa_check(head(node) == saved[i][1], \"An input head changed\")\n        pa_check(tail(node) is saved[i][2], \"An input tail changed\")\n    return True\n\ndef pa_prefix(s, expected):\n    current = s\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Stream ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected stream value\")\n        if i + 1 < len(expected):\n            current = stream_tail(current)\n    return True\n", "id": "D35"}, {"n": 36, "title": "Decode a route and stream its cost", "fn": "route_cost_stream", "stage": "6 | Transfer and synthesis", "task": "mat is a directed nonnegative cost matrix, start a valid house index, and deltas a finite or infinite numeric stream. Each delta shifts the current house index; all resulting houses are valid and may repeat. Emit cumulative travel cost AFTER each move, excluding any initial zero. Build the first result in O(1), advance lazily, memoize output tails, and leave all inputs unchanged. Assume O(1) source steps. Do not first materialize the decoded route.", "examples": "mat = [[0,4,9], [2,0,3], [7,1,0]]\nroute_cost_stream(mat, 0, stream(1,1,-2))\n# values: 4, 7, 14", "hints": ["Two summaries of the past are needed: current house and total cost.", "Decode destination first, then read mat[current][destination], then update both state variables."], "idea": "This composes adjacent directed costs, prefix decoding and delayed scans without an intermediate route. The helper state gives the meaning of every output and prevents swapping matrix coordinates.", "complexity": "O(1) construction; O(n) prefix time and retained output for n moves, excluding the existing matrix/source.", "section": "G06, G09, G15-G16", "solution": "def route_cost_stream(mat, start, deltas):\n\n    def build(source, current, total):\n        if is_none(source):\n            return None\n        dest = current + head(source)\n        updated = total + mat[current][dest]\n        return (\n            pair(updated, memo_fun(lambda: build(stream_tail(source), dest, updated)))\n        )\n    return build(deltas, start, 0)\n", "support": "def memo_fun(f):\n    done = False\n    value = None\n    def force():\n        nonlocal done, value\n        if not done:\n            value = f()\n            done = True\n        return value\n    return force\n", "starter": "def route_cost_stream(mat, start, deltas):\n    # Replace this line with your solution.\n    return error(\"Not implemented yet\")\n", "tests": "mat = [[0,4,9], [2,0,3], [7,1,0]]\ns = route_cost_stream(mat, 0, stream(1,1,-2))\npa_prefix(s, [4, 7, 14])\npa_check(stream_tail(s) is stream_tail(s), \"Memoized tail\")\npa_prefix(route_cost_stream(mat, 0, stream(0,2,0,-1,1)), [0,9,9,10,13])\npa_check(is_none(route_cost_stream(mat, 0, None)), \"No moves\")\nprint(\"D36: all supplied checks passed\")\n", "testSupport": "# Practice helpers, defined here; these are not extra built-ins.\ndef pa_check(condition, message):\n    if not condition:\n        return error(message)\n    return True\n\ndef pa_values(xs, expected):\n    current = xs\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Linked result ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected linked value\")\n        current = tail(current)\n    return pa_check(is_none(current), \"Unexpected extra linked values\")\n\ndef pa_snapshot(xs):\n    saved = [None] * length(xs)\n    for i in range(len(saved)):\n        saved[i] = [xs, head(xs), tail(xs)]\n        xs = tail(xs)\n    return saved\n\ndef pa_unchanged(saved):\n    for i in range(len(saved)):\n        node = saved[i][0]\n        pa_check(head(node) == saved[i][1], \"An input head changed\")\n        pa_check(tail(node) is saved[i][2], \"An input tail changed\")\n    return True\n\ndef pa_prefix(s, expected):\n    current = s\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Stream ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected stream value\")\n        if i + 1 < len(expected):\n            current = stream_tail(current)\n    return True\n", "id": "D36"}], "sheet": ["## CONTRACT FIRST\nRepresentation? Output? May mutate? Must restore? No new pairs? Initial-call or total cost? Empty/singleton? Sorted/disjoint? State a meaning for every helper argument.\n\n**Shapes:** llist(a,b) = pair(a,pair(b,None)). pair(a,b) is a record. Linked tail is data; stream tail is a nullary function. Never head/tail(None).\n\n## SOURCE ACADEMY PYTHON §3\nUse x=x+1, separate assignments, for i in range(n), explicit arguments. No .append/.pop, slices, tuples/unpacking, comprehensions, default parameters or chained comparisons. Conditions must be Boolean: is_none(xs), i<n. Use print(...) to inspect results.\n\nb=a aliases; b=tail(b) rebinds; set_tail(b,x) mutates. is tests identity; == compares values/structure. nonlocal rebinds an enclosing local. / divides; // floors; ** is power. Check bounds before indexing.\n\n```python\nmat = [None] * R\nfor r in range(R):\n    mat[r] = [0] * C  # fresh each time\n# NOT [[0] * C] * R: shared rows\n```\nIndexed lists have allocated slots: track a used length. append(xs,ys) is LINKED concatenation. len(a) is for indexed lists/strings; length(xs) traverses a linked list.\n\n## LISTS: BASE / STEP / COMBINE\n```python\ndef map_ll(f, xs):\n    if is_none(xs): return None\n    return pair(f(head(xs)),\n                map_ll(f, tail(xs)))\n```\nFilter: build rest once; prepend head if kept, otherwise return rest. Prepending to an accumulator reverses order. Repeated linked append/length may cost O(n^2).\n\n## ADJACENT PAIRS / DIRECTED ROUTE\n```python\nif is_none(xs) or is_none(tail(xs)):\n    return 0\nu = head(xs)\nv = head(tail(xs))\nreturn mat[u][v] + walk(tail(xs))\n```\nFragment: walk closes over mat. Advance ONE node. n values give n-1 legs. mat[u][v] need not equal mat[v][u].\n\n## ENCODE / DECODE STATE\nEncoder: emit first unchanged; thereafter emit current-previous, then previous=current ORIGINAL input. Decoder: updated=total+head(ds); emit updated and pass updated onward. Empty gives None.\n\n```python\ndef scan(xs, total):\n    if is_none(xs): return None\n    new = total + head(xs)\n    return pair(new, scan(tail(xs), new))\n# scan(xs, 0): no extra initial output\n```", "## MATRICES / INDEX FORMULAS\nmat[r][c]; rows=len(mat), cols=len(mat[0]). Make independent rows. Separate block offset from direction within the block.\n\n```python\n# Alternating columns, starting at 1:\noffset = r if c % 2 == 0 else R-1-r\nvalue = c*R + 1 + offset\n# Alternating rows:\noffset = c if r % 2 == 0 else C-1-c\nvalue = r*C + 1 + offset\n# Transpose: out[c][r] = mat[r][c]\n```\nTest 2x4, 1xC and Rx1. O(RC) construction.\n\n## POSTFIX: FIXED SLOTS + LIVE COUNT\n```python\nstack = [None] * len(tokens)\ntop = 0\nfor i in range(len(tokens)):\n    token = tokens[i]\n    if is_string(token):\n        top = top - 1\n        right = stack[top]\n        top = top - 1\n        left = stack[top]\n        # Compute value = left OP right.\n        stack[top] = value\n    else:\n        stack[top] = token\n    top = top + 1\nreturn stack[0]\n```\nTemplate: add operator dispatch as in G10. Assumes valid binary tokens. top counts live values; stale slots do not matter. First removed = RIGHT. Unary op consumes one. O(tokens) time/space. Test - and /.\n\n## DESTRUCTIVE REVERSE\n```python\nprev = None\nwhile not is_none(xs):\n    nxt = tail(xs)  # save before mutation\n    set_tail(xs, prev)\n    prev = xs\n    xs = nxt\nreturn prev\n```\nNo new pairs or head changes. Filter/partition: save next, detach node, link using first/last references. Terminate final tails at None.\n\n## DESTRUCTIVE ASCENDING MERGE\n```python\ndef merge(xs, ys):\n    if is_none(xs): return ys\n    if is_none(ys): return xs\n    if head(xs) <= head(ys):\n        set_tail(xs, merge(tail(xs), ys))\n        return xs\n    set_tail(ys, merge(xs, tail(ys)))\n    return ys\n```\nSorted, acyclic, disjoint inputs. <= takes left first on ties. O(n+m) time AND stack: recursion is not tail-position. Merge sort: find midpoint, SAVE second=tail(slow), CUT set_tail(slow,None), sort halves, merge. O(n log n); O(n) stack with this merge.", "## BACKTRACK: GUARD / MARK / EXPLORE / UNDO\n```python\ndef shortest(maze, r, c):\n    R = len(maze)\n    C = len(maze[0])\n    if r<0 or r>=R or c<0 or c>=C:\n        return math_inf\n    if maze[r][c] == '#': return math_inf\n    if maze[r][c] == 'G': return 0\n    old = maze[r][c]\n    maze[r][c] = '#'\n    best = min(shortest(maze,r-1,c),\n               shortest(maze,r+1,c),\n               shortest(maze,r,c-1),\n               shortest(maze,r,c+1))\n    maze[r][c] = old\n    return 1 + best\n```\nMark only the current path. Restore BEFORE return, including success. Goal=0 counts moves, not cells. 1+infinity=infinity. Worst-case exponential time; O(RC) stack.\n\n| Objective | Fail | Goal | Combine |\n| Reachable | False | True | OR |\n| Simple path count | 0 | 1 | Sum |\n| Minimum moves | infinity | 0 | 1+min |\n\n## STATE MUST EXPLAIN FUTURE CHOICES\nKey: [r,c,has_key]. Wall break: [r,c,used]. Exact k moves with revisits: [r,c,k]. Same coordinate with different resources can be a different state.\n\nDo not cache path-marked DFS only by coordinate: blocked cells depend on history. Exact-k walks with revisits can cache by [r,c,k]; test success at k==0 if earlier goal visits may continue.\n\nBFS: process distance layers; mark on enqueue. A preallocated queue of RC slots uses front/back indices. Each cell enqueues once. Expanded states need expanded capacity. O(RC) for unit-cost grid shortest paths. Weighted moves need different reasoning.\n\n## COST / BINARY-SEARCH BOUNDARY\nPair operations, indexed access and len: O(1). Linked length/index: O(n). Preallocate k slots: O(k). Count repeated work. Output, control stack and closures are separate space costs.\n\n```python\n# First index with a[i] >= x; else len(a)\nlo = 0\nhi = len(a)\nwhile lo < hi:\n    mid = (lo + hi) // 2\n    if a[mid] < x: lo = mid + 1\n    else: hi = mid\nreturn lo\n```\nBefore lo is too small; at/after hi meets threshold. Empty/duplicates work. O(log(n+1)) time, O(1) space. §3 proper tail calls use O(1) control space; pending addition/pair construction does not.", "## STREAM = pair(value, THUNK)\n```python\ndef chars(text):\n    def go(i):\n        if i == len(text): return None\n        return pair(text[i], lambda: go(i+1))\n    return go(0)\n```\nhead(s)=value; tail(s)=function; stream_tail(s)=next stream. Recursive call INSIDE lambda. Carry an index. O(1) construction; O(n) for n outputs. Filter may scan far before its first match.\n\n## MEMOIZED TAILS: DEFINE IF NOT SUPPLIED\n```python\ndef memo_fun(f):\n    done = False\n    value = None\n    def force():\n        nonlocal done, value\n        if not done:\n            value = f()\n            done = True\n        return value\n    return force\n```\npair(x,memo_fun(lambda: next_step(...))). done distinguishes cached None/0. Repeated forcing shares the suffix. Retaining n generated nodes costs O(n) memory.\n\n## LAZY SCAN / CURSORS\n```python\ndef scan_stream(s, total):\n    if is_none(s): return None\n    new = total + head(s)\n    return pair(new, memo_fun(\n        lambda: scan_stream(stream_tail(s),new)))\n```\nstream(a,b,c) is a finite constructor. eval_stream(s,n) requires n available elements. Walk one cursor: repeated stream_ref(s,i) from the head costs O(n^2) traversal even with cached tails. Avoid an unnecessary final force.\n\nKolakoski: seed 1,2,2; next length cursor at element 2, next symbol 1. Emit length copies; advance length cursor ONCE per run; toggle 3-symbol. Memoize seed and generated tails. Reader must only demand already available lengths. G18 gives the complete stream construction.\n\n## SCOPE / TREES / CPS / EVALUATORS\nClosure = function + enclosing bindings. Rebinding an outer local needs nonlocal; mutating its list does not. A new factory call gives fresh state. Return helper results from outer functions.\n\nTree cases: None / leaf / pair. Process head AND tail. Right fold: op(a,op(b,z)); left fold: op(op(z,a),b). Order matters.\n\nCPS: k is the rest of computation. Base -> k(0); next continuation is lambda rest: k(x*x+rest). §3 tail calls: O(1) control space, but O(n) pending closures here.\n\nEvaluator: inspect tag, recurse, lookup nearest binding. let RHS uses OLD environment; body uses extended one. Closure captures its creation environment. Evaluate only the chosen conditional branch.\n\n## FINAL CHECK\nEmpty/singleton; negatives/repeats; asymmetric/nonsquare; - and /; start=goal/unreachable; restoration; same nodes/no cycles; laziness; repeated forcing; missing return; actual time and space."], "checkHelpers": "# Practice helpers, defined here; these are not extra built-ins.\ndef pa_check(condition, message):\n    if not condition:\n        return error(message)\n    return True\n\ndef pa_values(xs, expected):\n    current = xs\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Linked result ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected linked value\")\n        current = tail(current)\n    return pa_check(is_none(current), \"Unexpected extra linked values\")\n\ndef pa_snapshot(xs):\n    saved = [None] * length(xs)\n    for i in range(len(saved)):\n        saved[i] = [xs, head(xs), tail(xs)]\n        xs = tail(xs)\n    return saved\n\ndef pa_unchanged(saved):\n    for i in range(len(saved)):\n        node = saved[i][0]\n        pa_check(head(node) == saved[i][1], \"An input head changed\")\n        pa_check(tail(node) is saved[i][2], \"An input tail changed\")\n    return True\n\ndef pa_prefix(s, expected):\n    current = s\n    for i in range(len(expected)):\n        pa_check(not is_none(current), \"Stream ended early\")\n        pa_check(head(current) == expected[i], \"Unexpected stream value\")\n        if i + 1 < len(expected):\n            current = stream_tail(current)\n    return True\n"};</script><script>"use strict";

function markdown(text){
 const lines=text.trim().split('\n');let out='',i=0;
 while(i<lines.length){
  let s=lines[i];if(!s.trim()){i++;continue;}
  if(s.startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);i++;out+=codeBlock(code.join('\n'));continue;}
  if(s.startsWith('## ')){out+='<h2>'+inline(s.slice(3))+'</h2>';i++;continue;}
  if(s.startsWith('|')){let rows=[];while(i<lines.length&&lines[i].startsWith('|'))rows.push(lines[i++].replace(/^\||\|$/g,'').split('|').map(v=>v.trim()));out+='<div class="tablewrap"><table><thead><tr>'+rows.shift().map(v=>'<th scope="col">'+inline(v)+'</th>').join('')+'</tr></thead><tbody>'+rows.filter(r=>!r.every(v=>/^[-: ]+$/.test(v))).map(r=>'<tr>'+r.map(v=>'<td>'+inline(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue;}
  if(/^\d+\. /.test(s)){out+='<ol>';while(i<lines.length&&/^\d+\. /.test(lines[i]))out+='<li>'+inline(lines[i++].replace(/^\d+\. /,''))+'</li>';out+='</ol>';continue;}
  let p=[s];i++;while(i<lines.length&&lines[i].trim()&&!/^(## |```|\||\d+\. )/.test(lines[i]))p.push(lines[i++]);out+='<p>'+inline(p.join(' '))+'</p>';
 }return out;
}

const traceStates=[[],[9],[9,4],[5],[5,2],[2.5]];
const traceNotes=['The live stack is empty. top = 0.','Push 9 into slot 0. top = 1.','Push 4 into slot 1. top = 2.','Remove right = 4, then left = 9. Push 9 − 4 = 5. top = 1.','Push 2 into slot 1. top = 2.','Remove right = 2, then left = 5. Push 5 / 2 = 2.5. top = 1.'];
function trace(){return `<p class="eyebrow">Trace lab · Illustrative model</p><h1>Watch the postfix invariant</h1><p class="lead">Process one token at a time. The first removed value is the right operand. The display shows the live prefix of the stack, not stale allocated slots.</p><div class="tracebox"><div class="tokens">${traceTokens.map((t,i)=>`<span class="token ${i<traceStep?'used':i===traceStep?'active':''}">${t}</span>`).join('')}</div><div class="stack" aria-label="Live stack, bottom to top">${traceStates[traceStep].map((v,i)=>`<div class="stackvalue">${v}${i===traceStates[traceStep].length-1?' ← top':''}</div>`).join('')||'<span class="muted small">Empty stack</span>'}</div><p role="status">${traceNotes[traceStep]}</p><div class="actions"><button id="trace-prev" ${traceStep===0?'disabled':''}>← Previous</button><button class="primary" id="trace-next" ${traceStep===5?'disabled':''}>Next token →</button><button id="trace-reset">Reset</button></div></div><p class="small muted">This is a teaching animation, not a Python interpreter. Try <a href="#d12">D12</a> in Source Academy to implement the algorithm with an added unary operator.</p>`;}
async function copyText(text,status,fallback){try{await navigator.clipboard.writeText(text);if(status)status.textContent='Copied. Open Source Academy, select Python §3, paste and run.';return true;}catch(e){if(fallback){fallback.innerHTML='<p class="small">Clipboard access was unavailable. Copy all of the selected program below.</p><textarea class="copyfallback" readonly aria-label="Complete runnable program for manual copying"></textarea>';const t=fallback.querySelector('textarea');t.value=text;t.focus();t.select();}if(status)status.textContent='Use the selected program below to copy manually.';return false;}}
function makeProgram(p,attempt){return '# '+p.id+' | Source Academy Python §3\n# Paste the complete program into the Python §3 playground.\n\n'+(p.support||'')+'\n'+DATA.checkHelpers+'\n# YOUR ATTEMPT\n'+attempt+'\n\n# SUPPLIED CHECKS\n'+p.tests+'\n';}
function downloadText(filename,text){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function attach(p){
 if(p){const id=p.id;$('#editor').addEventListener('input',e=>{saveDraft(id,e.target.value);$('#editor-status').textContent='Draft kept in this tab session. Download it for a lasting copy.';});$('#copy-program').onclick=()=>copyText(makeProgram(p,$('#editor').value),$('#editor-status'),$('#copy-fallback'));$('#download-attempt').onclick=()=>downloadText(id+'_attempt.py',makeProgram(p,$('#editor').value));$('#next-hint').onclick=()=>{
  hintStage++;
  if(hintStage<3){$('#hints').insertAdjacentHTML('beforeend','<div class="hintcontent"><h3>Hint '+hintStage+'</h3><p>'+inline(p.hints[hintStage-1])+'</p></div>');$('#next-hint').textContent=hintStage===1?'Reveal Hint 2':'Reveal explained solution';}
  else{$('#hints').insertAdjacentHTML('beforeend','<div class="solution"><h3>Why this works</h3>'+markdown(p.idea)+(p.support?'<p class="small muted">Include the memo_fun helper from G16; it is already included by the runnable-program buttons.</p>':'')+codeBlock(p.solution)+'<p><strong>Cost:</strong> '+inline(p.complexity)+'</p><a href="programs/'+id+'_reference.py" download>Download reference + checks (spoiler)</a></div>');$('#next-hint').hidden=true;}
 };}
 if(route==='trace'){$('#trace-next').onclick=()=>{traceStep=Math.min(5,traceStep+1);render(false);};$('#trace-prev').onclick=()=>{traceStep=Math.max(0,traceStep-1);render(false);};$('#trace-reset').onclick=()=>{traceStep=0;render(false);};}
}
function searchView(q){let query=q.toLowerCase();let gs=DATA.guide.filter(g=>(g.title+' '+g.body).toLowerCase().includes(query));let ps=DATA.problems.filter(p=>(p.title+' '+p.task+' '+p.fn).toLowerCase().includes(query));return `<p class="eyebrow">Search the study material</p><h1>Results for “${esc(q)}”</h1><p class="muted small">${gs.length} guide chapters and ${ps.length} exercises. Solutions are not searched, to keep answers out of your initial attempt.</p><h2>Guide</h2><div class="tocgrid">${gs.map(g=>`<a class="tocitem" href="#${g.id.toLowerCase()}"><span>${g.id}</span>${esc(g.title)}</a>`).join('')||'<p>No matching chapters.</p>'}</div><h2>Dojo</h2>${exerciseList(ps)}`;}
function render(scroll=true){
 route=(location.hash.slice(1)||'home').toLowerCase();let html='',p=null;const g=DATA.guide.find(g=>g.id.toLowerCase()===route);
 if(/^d\d\d$/.test(route))p=DATA.problems.find(p=>p.id.toLowerCase()===route);
 if(g)html=chapter(g);else if(p)html=problem(p);else if(route==='guide')html=guideIndex();else if(route==='dojo')html=dojo();else if(/^stage[1-6]$/.test(route))html=dojo(Number(route.slice(-1)));else if(route==='setup')html=setup();else if(route==='cheatsheet')html=sheet();else if(route==='downloads')html=downloads();else if(route==='github')html=github();else if(route==='sources')html=sources();else if(route==='trace')html=trace();else if(route.startsWith('search=')){let q;try{q=decodeURIComponent(location.hash.slice(8));}catch(e){q='';}html=searchView(q);}
 else{route='home';html=home();}
 $('#main').innerHTML=html;sidebar();attach(p);document.title=($('#main h1')?.textContent||'PA2 Practice Room')+' · Python §3';$('#sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');
 if(scroll){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
}
document.addEventListener('click',async e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main').focus();return;}const button=e.target.closest('[data-copy-code]');if(button){let ok=await copyText(button.parentElement.querySelector('code').textContent);button.textContent=ok?'Copied':'Select code to copy';if(!ok){let range=document.createRange();range.selectNodeContents(button.parentElement.querySelector('code'));let s=window.getSelection();s.removeAllRanges();s.addRange(range);}}});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();let q=$('#search-input').value.trim();if(q)location.hash='search='+encodeURIComponent(q);});
$('#theme-toggle').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#theme-toggle').textContent=dark?'Dark mode':'Light mode';};
$('#menu-toggle').onclick=()=>{let open=$('#sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open));};
window.addEventListener('hashchange',()=>render());
render(false);
</script></body></html>
